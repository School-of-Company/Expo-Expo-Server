name: Deploy

# main -> prod, develop -> dev (glink.kr, team1/expo)
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-expo-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    env:
      SVC: expo
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      REMOTE_ROOT: /srv/users/festa/2026/dev/team1/expo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew bootJar --no-daemon

      - name: Package
        run: |
          JAR="$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -n1)"
          cp "$JAR" app.jar
          tar czf release.tar.gz app.jar

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EXPO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EXPO_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          HOST: ${{ vars.EXPO_SSH_HOST }}
          PORT: ${{ vars.EXPO_SSH_PORT }}
          USER: ${{ vars.EXPO_SSH_USER }}
        run: |
          REL="${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          scp -P "$PORT" release.tar.gz "$USER@$HOST:$REMOTE_ROOT/apps/$DEPLOY_ENV/$SVC/incoming/$REL.tar.gz"
          ssh -p "$PORT" "$USER@$HOST" "$REMOTE_ROOT/bin/deploy.sh $SVC $DEPLOY_ENV $REL"
