swagger:
  enabled: ${SWAGGER_ENABLED:false}
  include-internal: ${SWAGGER_INCLUDE_INTERNAL:false}

springdoc:
  api-docs:
    enabled: ${swagger.enabled}
    path: /expo/v3/api-docs
  swagger-ui:
    enabled: ${swagger.enabled}
    path: /expo/swagger-ui.html
    disable-swagger-default-url: true

spring:
  application:
    name: expo-expo-server
  main:
    # stdout은 JSON 로그 줄만 둔다(배너는 여러 줄 평문이라 로그 수집기가 줄마다 깨진 로그로 받는다)
    banner-mode: "off"
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: sched-
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: ${KAFKA_STANDARD_CREATED_GROUP_ID:expo-expo-server.standard-created}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: ${KAFKA_PRODUCER_COMPRESSION_TYPE:zstd}
      properties:
        enable.idempotence: true
        max.request.size: ${KAFKA_PRODUCER_MAX_REQUEST_SIZE:5242880}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expo}
    username: ${DB_USERNAME:expo}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  level:
    org.springframework.kafka.listener: "OFF"
  # 요청마다 접근 로그 한 줄(module=HttpAccess). 끄려면 LOGGING_HTTP_ACCESS_ENABLED=false
  http-access:
    enabled: ${LOGGING_HTTP_ACCESS_ENABLED:true}

image:
  public-base-url: ${IMAGE_PUBLIC_BASE_URL:http://localhost:8080}
  storage:
    active: ${IMAGE_STORAGE_PROVIDER:local}
    local:
      directory: ${IMAGE_STORAGE_DIRECTORY:./data/images}

expo:
  standard-created:
    enabled: ${KAFKA_STANDARD_CREATED_ENABLED:false}
  # 박람회·프로그램 변경 이벤트(expo.expo.changed) 아웃박스와 릴레이. docs/expo-change-events.md
  events:
    enabled: ${KAFKA_EXPO_EVENTS_ENABLED:false}
    relay-delay-ms: ${KAFKA_EXPO_EVENTS_RELAY_DELAY_MS:1000}
    batch-size: ${KAFKA_EXPO_EVENTS_BATCH_SIZE:100}
  form-service-url: ${FORM_SERVICE_URL:}
  standard:
    user-service-url: ${USER_SERVICE_URL:}
    application-service-url: ${APPLICATION_SERVICE_URL:}
  training:
    sms:
      enabled: ${KAFKA_TRAINING_SMS_ENABLED:false}
      contract-verified: ${KAFKA_TRAINING_SMS_CONTRACT_VERIFIED:false}
      relay-delay-ms: ${KAFKA_TRAINING_SMS_RELAY_DELAY_MS:5000}
      batch-size: ${KAFKA_TRAINING_SMS_BATCH_SIZE:20}
    user-service-url: ${USER_SERVICE_URL:}
    application-service-url: ${APPLICATION_SERVICE_URL:}
  attention:
    service-url: ${ATTENTION_SERVICE_URL:}
    internal-token: ${ATTENTION_INTERNAL_TOKEN:}

management:
  metrics:
    distribution:
      # GC 일시 정지 p99를 구하려고 jvm_gc_pause_seconds에 고정 경계 10개(+Inf 포함 버킷 11개)를 둔다(Expo-Monitoring #34).
      # percentiles-histogram은 시리즈당 버킷이 약 69개라 카디널리티가 커서 쓰지 않는다
      slo:
        jvm.gc.pause: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
